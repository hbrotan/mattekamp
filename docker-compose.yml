name: mattekamp

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Mattekamp!Lokal1"
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Mattekamp!Lokal1' -Q 'select 1' -b -o /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "Server=db,1433;Database=mattekamp;User Id=sa;Password=Mattekamp!Lokal1;Encrypt=true;TrustServerCertificate=true"
      DB_AUTO_CREATE: "true"
      SECURE_COOKIES: "false"
    ports:
      - "${APP_PORT:-3000}:3000"
    profiles: ["app"]

volumes:
  sqldata:
